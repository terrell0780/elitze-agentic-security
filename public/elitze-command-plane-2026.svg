<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">ELITZE Agentic Security Command Plane</title>
  <desc id="desc">Abstract three-dimensional command plane with layered security rings, identity nodes, policy gates, execution paths and evidence signals.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="70%">
      <stop offset="0" stop-color="#142b37"/>
      <stop offset=".52" stop-color="#08141d"/>
      <stop offset="1" stop-color="#03070b"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8fdff"/>
      <stop offset=".32" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ddd6fe"/>
      <stop offset=".45" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="glowC"><feGaussianBlur stdDeviation="16" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowS"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#67e8f9" stroke-opacity=".045" stroke-width="1"/></pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <ellipse cx="800" cy="510" rx="610" ry="310" fill="none" stroke="#22d3ee" stroke-opacity=".10" stroke-width="2"/>
  <ellipse cx="800" cy="510" rx="500" ry="250" fill="none" stroke="#a78bfa" stroke-opacity=".10" stroke-width="2"/>
  <ellipse cx="800" cy="510" rx="390" ry="195" fill="none" stroke="#67e8f9" stroke-opacity=".18" stroke-width="2"/>
  <g fill="none" stroke-linecap="round">
    <path d="M160 690 C330 610 390 420 565 390 C690 369 704 260 800 235" stroke="#67e8f9" stroke-opacity=".32" stroke-width="3"/>
    <path d="M1440 690 C1270 610 1210 420 1035 390 C910 369 896 260 800 235" stroke="#a78bfa" stroke-opacity=".25" stroke-width="3"/>
    <path d="M120 320 C315 410 380 585 555 610 C675 627 706 740 800 785" stroke="#67e8f9" stroke-opacity=".21" stroke-width="2"/>
    <path d="M1480 320 C1285 410 1220 585 1045 610 C925 627 894 740 800 785" stroke="#a78bfa" stroke-opacity=".18" stroke-width="2"/>
  </g>
  <g filter="url(#glowC)" fill="#a7f3d0">
    <circle cx="160" cy="690" r="5"/><circle cx="565" cy="390" r="5"/><circle cx="800" cy="235" r="7"/><circle cx="1440" cy="690" r="5"/><circle cx="1035" cy="390" r="5"/>
  </g>
  <g transform="translate(800 500)">
    <ellipse rx="330" ry="165" fill="#071018" fill-opacity=".86" stroke="#67e8f9" stroke-opacity=".26" stroke-width="2"/>
    <ellipse rx="275" ry="138" fill="none" stroke="#67e8f9" stroke-opacity=".22" stroke-width="2" stroke-dasharray="7 14"/>
    <path d="M-205 30L-120-40L0-65L120-40L205 30L115 74L0 96L-115 74Z" fill="#0b1b25" stroke="#7dd3fc" stroke-opacity=".26" stroke-width="2"/>
    <path d="M-120-40L-120 28L0 56L120 28L120-40L0-65Z" fill="#102b37" stroke="#67e8f9" stroke-opacity=".22" stroke-width="2"/>
    <path d="M0-65V56" stroke="#67e8f9" stroke-opacity=".25" stroke-width="2"/>
    <path d="M-120 28L0-2L120 28" fill="none" stroke="#67e8f9" stroke-opacity=".18" stroke-width="2"/>
    <g fill="url(#cyan)" filter="url(#glowS)"><circle cx="0" cy="-7" r="13"/><circle cx="-120" cy="28" r="7"/><circle cx="120" cy="28" r="7"/><circle cx="0" cy="56" r="7"/></g>
    <g fill="none" stroke="url(#cyan)" stroke-width="3"><circle r="55"/><circle r="85" stroke-opacity=".46"/><circle r="118" stroke-opacity=".20"/></g>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#c9f9ff" font-size="19" letter-spacing="4">
