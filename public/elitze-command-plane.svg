<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">ELITZE Agentic Security control plane</title>
<desc id="desc">Architectural illustration showing agent discovery, identity, policy enforcement, runtime validation and evidence.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061018"/><stop offset="1" stop-color="#0b1822"/></linearGradient><linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1600" height="1000" rx="44" fill="url(#bg)"/>
<g opacity=".16" stroke="#67e8f9"><path d="M0 180h1600M0 360h1600M0 540h1600M0 720h1600M0 900h1600"/><path d="M200 0v1000M400 0v1000M600 0v1000M800 0v1000M1000 0v1000M1200 0v1000M1400 0v1000"/></g>
<g fill="none" stroke="#22d3ee" stroke-width="4" opacity=".55"><path d="M230 500H500M1100 500h270M800 210v160M800 630v160"/></g>
<g fill="none" stroke="#67e8f9" stroke-width="2" stroke-dasharray="8 12" opacity=".65"><path d="M230 500H1370"/><path d="M800 160v680"/></g>
<g filter="url(#glow)"><circle cx="800" cy="500" r="175" fill="#07151e" stroke="url(#cyan)" stroke-width="7"/><circle cx="800" cy="500" r="132" fill="none" stroke="#22d3ee" stroke-width="2" opacity=".5"/><circle cx="800" cy="500" r="92" fill="none" stroke="#67e8f9" stroke-width="2" opacity=".35"/></g>
<g fill="#f4f8fb" font-family="Inter,Arial,sans-serif" text-anchor="middle"><text x="800" y="475" font-size="44" font-weight="800">ELITZE</text><text x="800" y="515" font-size="20" fill="#67e8f9" letter-spacing="5">CONTROL PLANE</text><text x="800" y="548" font-size="14" fill="#8fa1af">identity · reach · policy · evidence</text></g>
<g font-family="Inter,Arial,sans-serif">
<g transform="translate(80 410)"><rect width="300" height="180" rx="26" fill="#0b1923" stroke="#22d3ee" stroke-opacity=".35"/><text x="28" y="48" fill="#67e8f9" font-size="13" font-weight="700" letter-spacing="3">DISCOVER</text><text x="28" y="92" fill="#f4f8fb" font-size="25" font-weight="800">Agents + MCP</text><text x="28" y="124" fill="#8fa1af" font-size="15">Authorized inventory</text><text x="28" y="150" fill="#8fa1af" font-size="15">Observed reachability</text></g>
<g transform="translate(1220 410)"><rect width="300" height="180" rx="26" fill="#0b1923" stroke="#22d3ee" stroke-opacity=".35"/><text x="28" y="48" fill="#67e8f9" font-size="13" font-weight="700" letter-spacing="3">EVIDENCE</text><text x="28" y="92" fill="#f4f8fb" font-size="25" font-weight="800">Prove + Retest</text><text x="28" y="124" fill="#8fa1af" font-size="15">Decision provenance</text><text x="28" y="150" fill="#8fa1af" font-size="15">Verification state</text></g>
<g transform="translate(610 55)"><rect width="380" height="125" rx="24" fill="#0b1923" stroke="#a78bfa" stroke-opacity=".45"/><text x="190" y="45" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="700" letter-spacing="3">GOVERN</text><text x="190" y="82" text-anchor="middle" fill="#f4f8fb" font-size="24" font-weight="800">Identity → Policy → Approval</text><text x="190" y="105" text-anchor="middle" fill="#8fa1af" font-size="13">Boundary before execution</text></g>
<g transform="translate(610 820)"><rect width="380" height="125" rx="24" fill="#0b1923" stroke="#4ade80" stroke-opacity=".4"/><text x="190" y="45" text-anchor="middle" fill="#86efac" font-size="13" font-weight="700" letter-spacing="3">VALIDATE</text><text x="190" y="82" text-anchor="middle" fill="#f4f8fb" font-size="24" font-weight="800">Test → Observe → Verify</text><text x="190" y="105" text-anchor="middle" fill="#8fa1af" font-size="13">No evidence, no closure</text></g></g></svg>