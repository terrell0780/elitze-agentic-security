<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">ELITZE security validation and authorized pentest flow</title>
<desc id="desc">Architectural illustration of authorized testing from scope through adversarial test, policy enforcement, evidence and retest.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061018"/><stop offset="1" stop-color="#0b1822"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1600" height="900" rx="42" fill="url(#bg)"/>
<g opacity=".12" stroke="#67e8f9"><path d="M0 150h1600M0 300h1600M0 450h1600M0 600h1600M0 750h1600"/><path d="M160 0v900M320 0v900M480 0v900M640 0v900M800 0v900M960 0v900M1120 0v900M1280 0v900M1440 0v900"/></g>
<g font-family="Inter,Arial,sans-serif"><text x="90" y="95" fill="#67e8f9" font-size="14" font-weight="700" letter-spacing="4">ELITZE SECURITY VALIDATION</text><text x="90" y="145" fill="#f4f8fb" font-size="42" font-weight="850">Pentest every release. Verify every fix.</text><text x="90" y="182" fill="#8fa1af" font-size="17">Authorized scope → adversarial test → enforcement → evidence → retest</text>
<g transform="translate(90 285)"><g transform="translate(0 0)"><rect width="250" height="260" rx="28" fill="#0b1923" stroke="#22d3ee" stroke-opacity=".35"/><text x="24" y="42" fill="#22d3ee" font-size="12" font-weight="800" letter-spacing="3">01 · SCOPE</text><circle cx="125" cy="115" r="48" fill="none" stroke="#22d3ee" stroke-width="2" opacity=".45"/><circle cx="125" cy="115" r="9" fill="#22d3ee" filter="url(#g)"/><text x="24" y="190" fill="#f4f8fb" font-size="20" font-weight="800">Authorized target</text><text x="24" y="220" fill="#8fa1af" font-size="14">identity + boundary</text></g><g transform="translate(300 0)"><rect width="250" height="260" rx="28" fill="#0b1923" stroke="#a78bfa" stroke-opacity=".35"/><text x="24" y="42" fill="#a78bfa" font-size="12" font-weight="800" letter-spacing="3">02 · ATTACK</text><circle cx="125" cy="115" r="48" fill="none" stroke="#a78bfa" stroke-width="2" opacity=".45"/><circle cx="125" cy="115" r="9" fill="#a78bfa" filter="url(#g)"/><text x="24" y="190" fill="#f4f8fb" font-size="20" font-weight="800">Red-team / API / MCP</text><text x="24" y="220" fill="#8fa1af" font-size="14">controlled test</text></g><g transform="translate(600 0)"><rect width="250" height="260" rx="28" fill="#0b1923" stroke="#67e8f9" stroke-opacity=".35"/><text x="24" y="42" fill="#67e8f9" font-size="12" font-weight="800" letter-spacing="3">03 · ENFORCE</text><circle cx="125" cy="115" r="48" fill="none" stroke="#67e8f9" stroke-width="2" opacity=".45"/><circle cx="125" cy="115" r="9" fill="#67e8f9" filter="url(#g)"/><text x="24" y="190" fill="#f4f8fb" font-size="20" font-weight="800">Policy boundary</text><text x="24" y="220" fill="#8fa1af" font-size="14">allow / deny / approval</text></g><g transform="translate(900 0)"><rect width="250" height="260" rx="28" fill="#0b1923" stroke="#4ade80" stroke-opacity=".35"/><text x="24" y="42" fill="#4ade80" font-size="12" font-weight="800" letter-spacing="3">04 · PROVE</text><circle cx="125" cy="115" r="48" fill="none" stroke="#4ade80" stroke-width="2" opacity=".45"/><circle cx="125" cy="115" r="9" fill="#4ade80" filter="url(#g)"/><text x="24" y="190" fill="#f4f8fb" font-size="20" font-weight="800">Evidence ledger</text><text x="24" y="220" fill="#8fa1af" font-size="14">observed + provenance</text></g><g transform="translate(1200 0)"><rect width="250" height="260" rx="28" fill="#0b1923" stroke="#67e8f9" stroke-opacity=".35"/><text x="24" y="42" fill="#67e8f9" font-size="12" font-weight="800" letter-spacing="3">05 · RETEST</text><circle cx="125" cy="115" r="48" fill="none" stroke="#67e8f9" stroke-width="2" opacity=".45"/><circle cx="125" cy="115" r="9" fill="#67e8f9" filter="url(#g)"/><text x="24" y="190" fill="#f4f8fb" font-size="20" font-weight="800">Fix verification</text><text x="24" y="220" fill="#8fa1af" font-size="14">closure only with evidence</text></g></g>
<g fill="none" stroke="#67e8f9" stroke-width="3" opacity=".55"><path d="M340 415h50M640 415h50M940 415h50M1240 415h50"/></g>
<rect x="90" y="615" width="1420" height="160" rx="28" fill="#08151e" stroke="#22d3ee" stroke-opacity=".22"/><text x="120" y="660" fill="#67e8f9" font-size="12" font-weight="800" letter-spacing="3">EVIDENCE RULE</text><text x="120" y="704" fill="#f4f8fb" font-size="25" font-weight="800">No runner → no claimed pentest result.</text><text x="120" y="738" fill="#8fa1af" font-size="15">The control surface can validate an authorized test request, but ELITZE must not label a test “completed” until an actual runner returns evidence.</text></g></svg>