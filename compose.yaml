name: elitze-agentic-security

services:
  postgres:
    image: postgres:18.6-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: elitze
      POSTGRES_USER: elitze
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elitze -d elitze"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run/postgresql:rw,noexec,nosuid,size=16m
    cap_drop:
      - NET_RAW
    pids_limit: 256
    mem_limit: 1g
    cpus: "1.0"
    stop_grace_period: 1m

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: elitze-agentic-security:local
    restart: "no"
    command: ["node", "scripts/migrate.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - database_url
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: "1.0"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: elitze-agentic-security:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      DATABASE_URL_FILE: /run/secrets/database_url
      ELITZE_TRUST_PROXY: "false"
    secrets:
      - database_url
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - edge
      - backend
    ports:
      - "${ELITZE_BIND_ADDRESS:-127.0.0.1}:${ELITZE_HTTP_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: "1.0"
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true

secrets:
  postgres_password:
    environment: ELITZE_POSTGRES_PASSWORD
  database_url:
    environment: ELITZE_DATABASE_URL
