name: ELITZE production gates

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: elitze-production-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-review:
    name: Code review gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout exact review commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Database configuration contract
        run: npm run db:config-self-test

      - name: Production configuration contract
        run: npm run production-config:self-test

      - name: Sanitized readiness diagnostics self-test
        run: npm run health-observability:self-test

      - name: Tenant overview data boundary
        run: npm run tenant-overview:self-test

      - name: Diff and whitespace review
        run: |
          git diff --check
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin main --depth=1
            git diff --check "origin/main...HEAD"
          fi

      - name: Verify dependency install-script policy
        run: |
          node -e "const p=require('./package.json'); const required=['esbuild','unrs-resolver']; const missing=required.filter((name)=>p.allowScripts?.[name]!==true); if(missing.length){console.error('Missing allowScripts entries:',missing.join(', ')); process.exit(1)} console.log('Build-script allowlist verified:',required.join(', '));"

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Sale readiness review
        run: npm run sale:readiness

      - name: Security fabric self-test
        run: npm run security-fabric:self-test
      - name: RAG and vector search self-test
        run: npm run rag:self-test
      - name: Persistent agent workflow self-test
        run: npm run agent-workflow:self-test
      - name: Contact and acquisition routing self-test
        run: npm run contact-acquisition:self-test
      - name: Live validation self-test
        run: npm run live-validation:self-test
      - name: Security runner self-test
        run: npm run runner:self-test
      - name: Governed runner handshake integration self-test
        timeout-minutes: 16
        run: python3 generated/elitze_orchestrator.py --profile runner-handshake

      - name: Preserve orchestrator evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: elitze-orchestrator-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/elitze-orchestrator/
          if-no-files-found: error
          retention-days: 30

      - name: Vulnerability intelligence self-test
        run: npm run vulnerability-intelligence:self-test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Code review green light
        run: echo "GREEN LIGHT — review integrity, sale readiness, security fabric, live validation, typecheck, lint, and production build passed."

  verify:
    needs: code-review
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: elitze
          POSTGRES_PASSWORD: elitze
          POSTGRES_DB: elitze_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U elitze -d elitze_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: elitze
      PGPASSWORD: elitze
      PGDATABASE: elitze_ci
      ELITZE_AUTH_E2E_DISPOSABLE_DB: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Clean database migration
        run: npm run db:migrate

      - name: Verify dependency install-script policy
        run: |
          node -e "const p=require('./package.json'); const required=['esbuild','unrs-resolver']; const missing=required.filter((name)=>p.allowScripts?.[name]!==true); if(missing.length){console.error('Missing allowScripts entries:',missing.join(', ')); process.exit(1)} console.log('Build-script allowlist verified:',required.join(', '));"

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Security self-test
        run: npm run security:self-test

      - name: Contact and acquisition routing self-test
        run: npm run contact-acquisition:self-test

      - name: Production configuration contract
        run: npm run production-config:self-test

      - name: Authentication security self-test
        run: npm run auth:security-self-test

      - name: Data bridge self-test
        run: npm run data-bridge:self-test

      - name: MCP workload identity self-test
        run: npm run mcp-workload-identity:self-test

      - name: MCP upstream address self-test
        run: npm run mcp-upstream-address:self-test

      - name: Policy evidence self-test
        run: npm run policy-evidence:self-test

      - name: Phase 5-6 self-test
        run: npm run phase5-6:self-test

      - name: Global security and compliance catalog self-test
        run: npm run global-compliance:self-test

      - name: Legal control self-test
        run: npm run legal:control-self-test

      - name: Progressive proofing self-test
        run: npm run progressive-proofing:self-test

      - name: Security fabric self-test
        run: npm run security-fabric:self-test

      - name: RAG and vector search self-test
        run: npm run rag:self-test

      - name: Evidence expression self-test
        run: npm run evidence-expression:self-test

      - name: Pentest request self-test
        run: npm run pentest-request:self-test

      - name: Live validation self-test
        run: npm run live-validation:self-test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Authentication E2E database-safety contract
        run: npm run auth:e2e-safety-self-test

      - name: Real authentication DB E2E
        timeout-minutes: 5
        run: npm run auth:e2e-self-test

      - name: Generate SBOM
        run: npm sbom --sbom-format cyclonedx --sbom-type application --omit=dev > sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: elitze-agentic-security-sbom
          path: sbom.cdx.json
          if-no-files-found: error

  live-runner-handshake:
    name: Live production runner handshake
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify Live Runner Handshake and Execution Gate
        if: github.event_name != 'pull_request'
        timeout-minutes: 1
        shell: bash
        env:
          ELITZE_RUNNER_URL: ${{ secrets.ELITZE_RUNNER_URL }}
          ELITZE_RUNNER_HMAC_SECRET: ${{ secrets.ELITZE_RUNNER_HMAC_SECRET }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { createHmac, randomBytes, timingSafeEqual } = require("node:crypto");
          const base = process.env.ELITZE_RUNNER_URL?.trim();
          const secret = process.env.ELITZE_RUNNER_HMAC_SECRET ?? "";
          if (!base) {
            console.error("::error::Production blocker: ELITZE_RUNNER_URL is missing.");
            process.exit(1);
          }
          if (Buffer.byteLength(secret, "utf8") < 32) {
            console.error("::error::Production blocker: ELITZE_RUNNER_HMAC_SECRET is missing or shorter than 32 bytes.");
            process.exit(1);
          }
          let endpoint;
          try {
            const parsed = new URL(base);
            if (parsed.protocol !== "https:" || parsed.username || parsed.password || parsed.search || parsed.hash) {
              throw new Error("Runner URL must be an HTTPS origin without credentials, query, or fragment.");
            }
            endpoint = new URL("/api/handshake", parsed.origin);
          } catch (error) {
            console.error("::error::Invalid ELITZE_RUNNER_URL:", error.message);
            process.exit(1);
          }
          const hmac = (timestamp, body) => createHmac("sha256", secret).update(timestamp + "." + body).digest("hex");
          const timestamp = String(Date.now());
          const nonce = randomBytes(16).toString("hex");
          const payload = JSON.stringify({ action: "handshake", timestamp: Number(timestamp), nonce });
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 10000);
          (async () => {
            try {
              console.log("Dispatching signed live challenge to runner endpoint.");
              const response = await fetch(endpoint, {
                method: "POST",
                headers: {
                  "content-type": "application/json",
                  "x-elitze-timestamp": timestamp,
                  "x-elitze-signature": hmac(timestamp, payload),
                },
                body: payload,
                signal: controller.signal,
              });
              const body = await response.text();
              if (response.status !== 200) {
                console.error("::error::Runner handshake returned HTTP " + response.status + ". Response body suppressed.");
                process.exitCode = 1;
                return;
              }
              const responseTimestamp = response.headers.get("x-elitze-timestamp") ?? "";
              const responseSignature = response.headers.get("x-elitze-signature") ?? "";
              if (!/^\d{13}$/.test(responseTimestamp) || !/^[a-f0-9]{64}$/i.test(responseSignature)) {
                console.error("::error::Runner response omitted a valid cryptographic signature.");
                process.exitCode = 1;
                return;
              }
              const expected = Buffer.from(hmac(responseTimestamp, body), "hex");
              const supplied = Buffer.from(responseSignature, "hex");
              if (expected.length !== supplied.length || !timingSafeEqual(expected, supplied)) {
                console.error("::error::Runner response signature verification failed.");
                process.exitCode = 1;
                return;
              }
              const parsed = JSON.parse(body);
              if (parsed.ok !== true || parsed.action !== "handshake" || parsed.nonce !== nonce) {
                console.error("::error::Runner did not authenticate the challenge nonce.");
                process.exitCode = 1;
                return;
              }
              console.log("PASS: live runner challenge-response signature and nonce verified.");
            } catch (error) {
              console.error("::error::Live runner handshake failed:", error.name === "AbortError" ? "request timed out" : error.message);
              process.exitCode = 1;
            } finally {
              clearTimeout(timer);
            }
          })();
          NODE

  release-green-light:
    name: ${{ github.event_name == 'pull_request' && 'PR validation complete (production handshake not run)' || 'Final release green light' }}
    needs:
      - code-review
      - verify
      - live-runner-handshake
    if: always() && needs.code-review.result == 'success' && needs.verify.result == 'success' && (github.event_name == 'pull_request' || needs.live-runner-handshake.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Report validation scope
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "CI GREEN — code review, isolated database/security verification, sale readiness, typecheck, lint, build, dependency audit, and SBOM checks passed."
            echo "PRODUCTION RELEASE NOT APPROVED — the live production runner handshake is intentionally skipped for pull requests and has not been verified by this run."
          else
            echo "GREEN LIGHT — code review, security verification, sale readiness, live runner handshake, typecheck, lint, build, dependency audit, and SBOM gates passed."
            echo "This commit is eligible for merge evaluation and production promotion."
          fi
