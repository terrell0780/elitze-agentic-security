name: ELITZE production gates

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: elitze-production-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-review:
    name: Code review gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout exact review commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Database configuration contract
        run: npm run db:config-self-test

      - name: Production configuration contract
        run: npm run production-config:self-test

      - name: Sanitized readiness diagnostics self-test
        run: npm run health-observability:self-test

      - name: Tenant overview data boundary
        run: npm run tenant-overview:self-test

      - name: Diff and whitespace review
        run: |
          git diff --check
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin main --depth=1
            git diff --check "origin/main...HEAD"
          fi

      - name: Verify dependency install-script policy
        run: |
          node -e "const p=require('./package.json'); const required=['esbuild','unrs-resolver']; const missing=required.filter((name)=>p.allowScripts?.[name]!==true); if(missing.length){console.error('Missing allowScripts entries:',missing.join(', ')); process.exit(1)} console.log('Build-script allowlist verified:',required.join(', '));"

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Enterprise platform readiness
        run: npm run platform:readiness

      - name: Security fabric self-test
        run: npm run security-fabric:self-test
      - name: RAG and vector search self-test
        run: npm run rag:self-test
      - name: Persistent agent workflow self-test
        run: npm run agent-workflow:self-test
      - name: Workspace and security platform boundary self-test
        run: npm run workspace-platform:self-test
      - name: Live validation self-test
        run: npm run live-validation:self-test
      - name: Security runner self-test
        run: npm run runner:self-test
      - name: Governed runner handshake integration self-test
        timeout-minutes: 16
        run: python3 generated/elitze_orchestrator.py --profile runner-handshake

      - name: Preserve orchestrator evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: elitze-orchestrator-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/elitze-orchestrator/
          if-no-files-found: error
          retention-days: 30

      - name: Vulnerability intelligence self-test
        run: npm run vulnerability-intelligence:self-test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Public exposure guard
        env:
          ELITZE_PUBLIC_BASE_URL: https://www.elitze.info
        run: npm run public-exposure:self-test

      - name: Code review green light
        run: echo "GREEN LIGHT — review integrity, workspace readiness, security fabric, live validation, typecheck, lint, and production build passed."

  verify:
    needs: code-review
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: elitze
          POSTGRES_PASSWORD: elitze
          POSTGRES_DB: elitze_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U elitze -d elitze_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: elitze
      PGPASSWORD: elitze
      PGDATABASE: elitze_ci
      ELITZE_AUTH_E2E_DISPOSABLE_DB: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Clean database migration
        run: npm run db:migrate

      - name: Verify dependency install-script policy
        run: |
          node -e "const p=require('./package.json'); const required=['esbuild','unrs-resolver']; const missing=required.filter((name)=>p.allowScripts?.[name]!==true); if(missing.length){console.error('Missing allowScripts entries:',missing.join(', ')); process.exit(1)} console.log('Build-script allowlist verified:',required.join(', '));"

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Security self-test
        run: npm run security:self-test

      - name: Workspace and security platform boundary self-test
        run: npm run workspace-platform:self-test

      - name: Production configuration contract
        run: npm run production-config:self-test

      - name: Authentication security self-test
        run: npm run auth:security-self-test

      - name: Data bridge self-test
        run: npm run data-bridge:self-test

      - name: MCP workload identity self-test
        run: npm run mcp-workload-identity:self-test

      - name: MCP upstream address self-test
        run: npm run mcp-upstream-address:self-test

      - name: Policy evidence self-test
        run: npm run policy-evidence:self-test

      - name: Phase 5-6 self-test
        run: npm run phase5-6:self-test

      - name: Global security and compliance catalog self-test
        run: npm run global-compliance:self-test

      - name: Legal control self-test
        run: npm run legal:control-self-test

      - name: Progressive proofing self-test
        run: npm run progressive-proofing:self-test

      - name: Security fabric self-test
        run: npm run security-fabric:self-test

      - name: RAG and vector search self-test
        run: npm run rag:self-test

      - name: Evidence expression self-test
        run: npm run evidence-expression:self-test

      - name: Pentest request self-test
        run: npm run pentest-request:self-test

      - name: Live validation self-test
        run: npm run live-validation:self-test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Public exposure guard
        env:
          ELITZE_PUBLIC_BASE_URL: https://www.elitze.info
        run: npm run public-exposure:self-test

      - name: Authentication E2E database-safety contract
        run: npm run auth:e2e-safety-self-test

      - name: Real authentication DB E2E
        timeout-minutes: 5
        run: npm run auth:e2e-self-test

      - name: Generate SBOM
        run: npm sbom --sbom-format cyclonedx --sbom-type application --omit=dev > sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: elitze-agentic-security-sbom
          path: sbom.cdx.json
          if-no-files-found: error

  live-runner-handshake:
    name: Live production runner handshake
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Verify GitHub OIDC identity and live runner challenge
        timeout-minutes: 1
        shell: bash
        env:
          ELITZE_RUNNER_URL: https://elitze-security-runner.onrender.com
        run: |
          set -euo pipefail
          node <<'NODE'
          const { randomBytes } = require("node:crypto");
          const base = process.env.ELITZE_RUNNER_URL?.trim();
          const tokenRequestUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL?.trim();
          const tokenRequestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN?.trim();
          if (!base) {
            console.error("::error::Runner URL is missing.");
            process.exit(1);
          }
          if (!tokenRequestUrl || !tokenRequestToken) {
            console.error("::error::GitHub OIDC token request is unavailable.");
            process.exit(1);
          }
          let endpoint;
          try {
            const parsed = new URL(base);
            if (parsed.protocol !== "https:" || parsed.username || parsed.password || parsed.pathname !== "/" || parsed.search || parsed.hash) {
              throw new Error("Runner URL must be an HTTPS origin without credentials, path, query, or fragment.");
            }
            endpoint = new URL("/api/github/handshake", parsed.origin);
          } catch (error) {
            console.error("::error::Invalid runner URL:", error.message);
            process.exit(1);
          }
          (async () => {
            let stage = "requesting GitHub OIDC token";
            try {
              const oidcUrl = new URL(tokenRequestUrl);
              oidcUrl.searchParams.set("audience", "elitze-runner-handshake");
              const tokenResponse = await fetch(oidcUrl, {
                headers: { authorization: "Bearer " + tokenRequestToken, accept: "application/json" },
                signal: AbortSignal.timeout(15000),
              });
              if (!tokenResponse.ok) {
                console.error("::error::GitHub OIDC token request failed with HTTP " + tokenResponse.status + ".");
                process.exitCode = 1;
                return;
              }
              const tokenPayload = await tokenResponse.json();
              if (typeof tokenPayload.value !== "string" || !tokenPayload.value) {
                console.error("::error::GitHub OIDC response did not contain a token.");
                process.exitCode = 1;
                return;
              }
              const nonce = randomBytes(16).toString("hex");
              const payload = JSON.stringify({ action: "github-handshake", timestamp: Date.now(), nonce });
              stage = "posting authenticated challenge to Render runner";
              const response = await fetch(endpoint, {
                method: "POST",
                headers: { "content-type": "application/json", authorization: "Bearer " + tokenPayload.value },
                body: payload,
                signal: AbortSignal.timeout(25000),
              });
              if (response.status !== 200) {
                console.error("::error::Authenticated runner handshake returned HTTP " + response.status + ". Response body suppressed.");
                process.exitCode = 1;
                return;
              }
              stage = "validating runner attestation";
              const result = await response.json();
              const age = Math.abs(Date.now() - Number(result.timestamp));
              if (result.ok !== true || result.action !== "github-handshake" || result.nonce !== nonce ||
                  result.repository !== "terrell0780/elitze-agentic-security" ||
                  result.workflowRef !== "terrell0780/elitze-agentic-security/.github/workflows/production-gates.yml@refs/heads/main" ||
                  !Number.isFinite(age) || age > 60000) {
                console.error("::error::Live runner did not attest the authorized GitHub workflow challenge.");
                process.exitCode = 1;
                return;
              }
              console.log("PASS: GitHub OIDC identity, authorized workflow, HTTPS runner reachability, and challenge nonce verified.");
            } catch (error) {
              const timedOut = error.name === "AbortError" || error.name === "TimeoutError";
              console.error("::error::Live runner handshake failed during " + stage + ": " + (timedOut ? "request timed out" : error.message));
              process.exitCode = 1;
            }
          })();
          NODE

  release-green-light:
    name: ${{ github.event_name == 'pull_request' && 'PR validation complete (production handshake not run)' || 'Final release green light' }}
    needs:
      - code-review
      - verify
      - live-runner-handshake
    if: always() && needs.code-review.result == 'success' && needs.verify.result == 'success' && (github.event_name == 'pull_request' || needs.live-runner-handshake.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Report validation scope
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "CI GREEN — code review, isolated database/security verification, workspace readiness, typecheck, lint, build, dependency audit, and SBOM checks passed."
            echo "PRODUCTION RELEASE NOT APPROVED — the live production runner handshake is intentionally skipped for pull requests and has not been verified by this run."
          else
            echo "GREEN LIGHT — code review, security verification, workspace readiness, live runner handshake, typecheck, lint, build, dependency audit, and SBOM gates passed."
            echo "This commit is eligible for merge evaluation and production promotion."
          fi
