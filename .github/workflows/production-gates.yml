name: Production gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

concurrency:
  group: production-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-security:
    if: github.event_name != 'schedule'
    name: Static checks and security self-tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production configuration self-test
        run: npm run production-config:self-test
      - name: Tenant database isolation readiness self-test
        run: npm run database-isolation-readiness:self-test
      - name: Security self-test
        run: npm run test
      - name: Authentication security self-test
        run: npm run auth:security-self-test
      - name: Data Bridge self-test
        run: npm run data-bridge:self-test
      - name: Security-tool integration self-test
        run: npm run security-tool-integrations:self-test
      - name: Tenant role and owner onboarding self-test
        run: npm run tenant-security:self-test
      - name: Platform-owner boundary self-test
        run: npm run platform-owner:self-test
      - name: MCP workload identity self-test
        run: npm run mcp-workload-identity:self-test
      - name: Authentication E2E safety self-test
        run: npm run auth:e2e-safety-self-test

  dependency-audit:
    if: github.event_name != 'schedule'
    name: Production dependency audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  authentication-e2e:
    if: github.event_name != 'schedule'
    name: Real authentication DB E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: elitze_ci
          POSTGRES_PASSWORD: elitze_ci_password
          POSTGRES_DB: elitze_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elitze_ci -d elitze_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply migrations to disposable CI database
        run: npm run db:migrate
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: elitze_ci
          PGPASSWORD: elitze_ci_password
          PGDATABASE: elitze_ci
          DATABASE_SSL: "disable"
          ELITZE_AUTH_E2E_DISPOSABLE_DB: "true"
      - name: Production build for authentication E2E
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3010
      - name: Real authentication DB E2E
        run: npm run auth:e2e-self-test
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: elitze_ci
          PGPASSWORD: elitze_ci_password
          PGDATABASE: elitze_ci
          DATABASE_SSL: "disable"
          ELITZE_AUTH_E2E_DISPOSABLE_DB: "true"

  build:
    if: github.event_name != 'schedule'
    name: Next.js production build
    runs-on: ubuntu-24.04
    needs: static-and-security
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.elitze.info

  audit:
    name: Axe WCAG and Lighthouse
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Set repository variable A11Y_AUDIT_URL to override the audited production origin.
      AUDIT_BASE_URL: ${{ vars.A11Y_AUDIT_URL || 'https://www.elitze.info' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify source accessibility contracts
        run: node scripts/a11y-contract-self-test.mjs
      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Install Axe, Lighthouse, and Chrome WebDriver
        run: |
          npm install --global @axe-core/cli lighthouse browser-driver-manager
          browser-driver-manager install chrome
      - name: Run WCAG 2.0, 2.1, and 2.2 A/AA scans on public and auth routes
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/axe
          BASE_URL="${AUDIT_BASE_URL%/}"
          status=0
          while IFS= read -r route; do
            [[ -z "$route" ]] && continue
            slug="$(printf '%s' "$route" | sed 's#^/$#home#; s#^/##; s#[^A-Za-z0-9._-]#-#g')"
            echo "::group::Axe WCAG audit: $route"
            if axe "$BASE_URL$route" \
              --tags wcag2a,wcag2aa,wcag21a,wcag21aa,wcag22a,wcag22aa \
              --exit --load-delay=1500 --timeout=120 \
              --chrome-options="no-sandbox,disable-setuid-sandbox,disable-dev-shm-usage" \
              --save "$slug.json" --dir artifacts/axe; then
              echo "Axe passed: $route"
            else
              echo "::error::Axe found violations or failed to scan $route"
              status=1
            fi
            echo "::endgroup::"
          done <<'ROUTES'
          /
          /platform
          /security
          /integrations
          /about
          /accessibility
          /security-disclosure
          /contact
          /faq
          /compare
          /compliance
          /orchestration
          /adversary-emulation
          /agentic-soc
          /recursive-agents
          /threat-detection
          /contributing
          /docs
          /privacy
          /terms
          /legal
          /use-cases
          /reo
          /login
          /register
          /forgot-password
          /reset-password
          ROUTES
          exit "$status"
      - name: Run Lighthouse accessibility and best-practices audits
        if: always() && steps.chrome.outcome == 'success'
        shell: bash
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/lighthouse
          BASE_URL="${AUDIT_BASE_URL%/}"
          for route in / /platform /security /about /login; do
            slug="$(printf '%s' "$route" | sed 's#^/$#home#; s#^/##; s#[^A-Za-z0-9._-]#-#g')"
            lighthouse "$BASE_URL$route" \
              --only-categories=accessibility,best-practices \
              --output=json --output-path="artifacts/lighthouse/$slug.json" \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --quiet
          done
          node --input-type=module -e '
            import fs from "node:fs";
            const dir = "artifacts/lighthouse";
            const files = fs.readdirSync(dir).filter((name) => name.endsWith(".json"));
            if (files.length === 0) {
              console.error("No Lighthouse reports were generated.");
              process.exit(1);
            }
            let failed = false;
            for (const file of files) {
              const report = JSON.parse(fs.readFileSync(dir + "/" + file, "utf8"));
              for (const category of ["accessibility", "best-practices"]) {
                const score = report.categories?.[category]?.score;
                const ok = typeof score === "number" && score >= 0.90;
                console.log(file + " " + category + ": " + (typeof score === "number" ? Math.round(score * 100) : "unavailable") + "/100");
                if (!ok) failed = true;
              }
            }
            if (failed) process.exitCode = 1;
          '
      - name: Upload WCAG and Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elitze-accessibility-audit
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 30
