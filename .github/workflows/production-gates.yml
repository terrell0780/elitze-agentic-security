name: ELITZE production gates

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - rehaul/2026-security-control-surface
      - security/full-green-gate-2026
      - security/enterprise-auth-green-2026-09-21
  pull_request:
    branches:
      - main
      - rehaul/2026-security-control-surface

permissions:
  contents: read

concurrency:
  group: elitze-production-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-review:
    name: Code review gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact review commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Diff and whitespace review
        run: |
          git diff --check
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin main --depth=1
            git diff --check "origin/main...HEAD"
          fi

      - name: Verify dependency install-script policy
        run: node -e "const p=require('./package.json'); const required=['esbuild','unrs-resolver']; const missing=required.filter((name)=>p.allowScripts?.[name]!==true); if(missing.length){console.error('Missing allowScripts entries:',missing.join(', ')); process.exit(1)} console.log('Build-script allowlist verified:',required.join(', '));"

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Sale readiness review
        run: npm run sale:readiness

      - name: Docker security static gate
        run: npm run docker:security-self-test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Code review green light
        run: echo "GREEN LIGHT — review integrity, sale readiness, Docker security policy, typecheck, lint, and production build passed."

  verify:
    needs: code-review
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify dependency install-script policy
        run: node -e "const p=require('./package.json'); const required=['esbuild','unrs-resolver']; const missing=required.filter((name)=>p.allowScripts?.[name]!==true); if(missing.length){console.error('Missing allowScripts entries:',missing.join(', ')); process.exit(1)} console.log('Build-script allowlist verified:',required.join(', '));"

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Security self-test
        run: npm run security:self-test

      - name: Authentication security self-test
        run: npm run auth:security-self-test

      - name: Data bridge self-test
        run: npm run data-bridge:self-test

      - name: MCP workload identity self-test
        run: npm run mcp-workload-identity:self-test

      - name: Policy evidence self-test
        run: npm run policy-evidence:self-test

      - name: Phase 5-6 self-test
        run: npm run phase5-6:self-test

      - name: Global security and compliance catalog self-test
        run: npm run global-compliance:self-test

      - name: Legal control self-test
        run: npm run legal:control-self-test

      - name: Progressive proofing self-test
        run: npm run progressive-proofing:self-test

      - name: Evidence expression self-test
        run: npm run evidence-expression:self-test

      - name: Pentest request self-test
        run: npm run pentest-request:self-test

      - name: Docker security static gate
        run: npm run docker:security-self-test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Generate SBOM
        run: npm sbom --sbom-format cyclonedx --sbom-type application --omit=dev > sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: elitze-agentic-security-sbom
          path: sbom.cdx.json
          if-no-files-found: error

  container-security:
    name: Container security gate
    needs: code-review
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Checkout exact review commit
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare ephemeral Compose validation environment
        shell: bash
        run: |
          PASSWORD="$(openssl rand -hex 32)"
          {
            echo "ELITZE_POSTGRES_PASSWORD=$PASSWORD"
            echo "ELITZE_DATABASE_URL=postgresql://elitze:$PASSWORD@postgres:5432/elitze"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "ELITZE_BIND_ADDRESS=127.0.0.1"
          } > .env.ci

      - name: Validate Compose configuration
        run: |
          docker compose --env-file .env.ci config --quiet
          docker compose --env-file .env.ci -f docker-compose.enterprise.yml config --quiet

      - name: Dockerfile build check
        run: docker buildx build --check .

      - name: Build runtime image with SBOM and provenance
        run: docker buildx build --load --sbom=true --provenance=mode=max -t elitze-agentic-security:ci .

      - name: Verify runtime image is unprivileged
        shell: bash
        run: |
          USER_ID="$(docker image inspect elitze-agentic-security:ci --format '{{.Config.User}}')"
          test "$USER_ID" = "nextjs"

      - name: Scan image for critical and high vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: elitze-agentic-security:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  release-green-light:
    name: Final release green light
    needs:
      - code-review
      - verify
      - container-security
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Confirm all release gates passed
        run: |
          echo "GREEN LIGHT — code review, security verification, Docker container security, sale readiness, typecheck, lint, build, dependency audit, and SBOM gates passed."
          echo "This commit is eligible for merge evaluation and production promotion."
