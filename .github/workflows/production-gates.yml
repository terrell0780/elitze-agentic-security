name: ELITZE production gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: elitze-production-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and create lockfile when absent
        run: npm install --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Security self-test
        run: npm run security:self-test

      - name: Data bridge self-test
        run: npm run data-bridge:self-test

      - name: MCP workload identity self-test
        run: npm run mcp-workload-identity:self-test

      - name: Policy evidence self-test
        run: npm run policy-evidence:self-test

      - name: Phase 5-6 self-test
        run: npm run phase5-6:self-test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Generate SBOM
        run: npm sbom --sbom-format cyclonedx --sbom-type application --omit=dev > sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: elitze-agentic-security-sbom
          path: sbom.cdx.json
          if-no-files-found: error
