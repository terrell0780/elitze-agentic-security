name: Production gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-security:
    name: Static checks and security self-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production configuration self-test
        run: npm run production-config:self-test
      - name: Security self-test
        run: npm run test
      - name: Authentication security self-test
        run: npm run auth:security-self-test
      - name: Data Bridge self-test
        run: npm run data-bridge:self-test
      - name: MCP workload identity self-test
        run: npm run mcp-workload-identity:self-test
      - name: Authentication E2E safety self-test
        run: npm run auth:e2e-safety-self-test

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  build:
    name: Next.js production build
    runs-on: ubuntu-latest
    needs: static-and-security
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.elitze.info
