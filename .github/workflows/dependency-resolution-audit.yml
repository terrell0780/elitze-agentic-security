name: ELITZE dependency resolution audit

on:
  push:
    branches:
      - rehaul/2026-security-control-surface

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install without lifecycle scripts for inspection
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Report pending lifecycle scripts
        run: npm install-scripts ls --json > npm-install-scripts-pending.json

      - name: Upload resolved dependency evidence
        uses: actions/upload-artifact@v4
        with:
          name: elitze-dependency-resolution
          path: |
            package-lock.json
            npm-install-scripts-pending.json
          if-no-files-found: error
