name: ELITZE Runner Handshake Gate

on:
  push:
    branches:
      - main
      - verify/runner-handshake-20261008
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: runner-handshake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-handshake-validation:
    name: Runner handshake and release checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verify runner-side challenge-response
        run: npm run runner:handshake-self-test

      - name: Verify control-plane challenge-response
        run: npm run runner:control-plane-handshake-self-test

      - name: Verify enterprise platform readiness
        run: npm run platform:readiness

      - name: Build production application
        run: npm run build

      - name: Build and smoke-test runner container
        run: |
          set -euo pipefail
          image="elitze-security-runner:${GITHUB_RUN_ID}"
          container="elitze-security-runner-smoke-${GITHUB_RUN_ID}"
          ci_secret="$(openssl rand -hex 32)"
          docker build -t "$image" runner/
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "$container" \
            --publish 127.0.0.1:18787:8787 \
            --env ELITZE_RUNNER_HMAC_SECRET="$ci_secret" \
            --env ELITZE_CALLBACK_ORIGIN="https://elitze.info" \
            --env ELITZE_RUNNER_ALLOWED_HOSTS="example.com" \
            --env ELITZE_RUNNER_ALLOW_PRIVATE_TARGETS="false" \
            "$image"
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:18787/health; then
              printf '\\nRunner container health: PASS\\n'
              RUNNER_URL="http://127.0.0.1:18787" RUNNER_SECRET="$ci_secret" node <<'NODE'
              const { createHmac, randomBytes, timingSafeEqual } = require("node:crypto");
              const url = process.env.RUNNER_URL + "/api/handshake";
              const secret = process.env.RUNNER_SECRET;
              const nonce = randomBytes(16).toString("hex");
              const timestamp = String(Date.now());
              const body = JSON.stringify({ action: "handshake", timestamp: Number(timestamp), nonce });
              const signature = (ts, payload) => createHmac("sha256", secret).update(ts + "." + payload).digest("hex");
              const headers = { "content-type": "application/json", "x-elitze-timestamp": timestamp, "x-elitze-signature": signature(timestamp, body) };
              (async () => {
                const response = await fetch(url, { method: "POST", headers, body });
                const responseBody = await response.text();
                if (response.status !== 200) throw new Error("signed handshake returned HTTP " + response.status);
                const responseTimestamp = response.headers.get("x-elitze-timestamp") || "";
                const responseSignature = response.headers.get("x-elitze-signature") || "";
                if (!/^\d{13}$/.test(responseTimestamp) || !/^[a-f0-9]{64}$/i.test(responseSignature)) throw new Error("response signature headers missing or invalid");
                const expected = Buffer.from(signature(responseTimestamp, responseBody), "hex");
                const supplied = Buffer.from(responseSignature, "hex");
                if (expected.length !== supplied.length || !timingSafeEqual(expected, supplied)) throw new Error("response HMAC did not verify");
                const parsed = JSON.parse(responseBody);
                if (parsed.ok !== true || parsed.action !== "handshake" || parsed.nonce !== nonce) throw new Error("signed nonce challenge did not verify");
                const replay = await fetch(url, { method: "POST", headers, body });
                if (replay.status !== 409) throw new Error("nonce replay was not rejected (HTTP " + replay.status + ")");
                const invalidTimestamp = String(Date.now());
                const invalidNonce = randomBytes(16).toString("hex");
                const invalidBody = JSON.stringify({ action: "handshake", timestamp: Number(invalidTimestamp), nonce: invalidNonce });
                const invalid = await fetch(url, { method: "POST", headers: { "content-type": "application/json", "x-elitze-timestamp": invalidTimestamp, "x-elitze-signature": "0".repeat(64) }, body: invalidBody });
                if (invalid.status !== 401) throw new Error("invalid HMAC was not rejected (HTTP " + invalid.status + ")");
                console.log("Runner container signed handshake: PASS (response HMAC, nonce, replay rejection, invalid-signature rejection)");
              })().catch((error) => { console.error(error.message); process.exitCode = 1; });
          NODE
              exit $?
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$container" 2>/dev/null || true)" != "true" ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1

      - name: Audit production dependencies
        run: npm audit --omit=dev
