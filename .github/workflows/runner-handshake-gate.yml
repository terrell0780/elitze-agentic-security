name: ELITZE Runner Handshake Gate

on:
  push:
    branches:
      - main
      - verify/runner-handshake-20261008
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: runner-handshake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-handshake-validation:
    name: Runner handshake and release checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verify runner-side challenge-response
        run: npm run runner:handshake-self-test

      - name: Verify control-plane challenge-response
        run: npm run runner:control-plane-handshake-self-test

      - name: Verify sale-readiness gate
        run: npm run sale:readiness

      - name: Build production application
        run: npm run build

      - name: Build and smoke-test runner container
        run: |
          set -euo pipefail
          image="elitze-security-runner:${GITHUB_RUN_ID}"
          container="elitze-security-runner-smoke-${GITHUB_RUN_ID}"
          ci_secret="$(openssl rand -hex 32)"
          docker build -t "$image" runner/
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "$container" \
            --publish 127.0.0.1:18787:8787 \
            --env ELITZE_RUNNER_HMAC_SECRET="$ci_secret" \
            --env ELITZE_CALLBACK_ORIGIN="https://www.elitze.info" \
            --env ELITZE_RUNNER_ALLOWED_HOSTS="example.com" \
            --env ELITZE_RUNNER_ALLOW_PRIVATE_TARGETS="false" \
            "$image"
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:18787/health; then
              printf '\\nRunner container health: PASS\\n'
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$container" 2>/dev/null || true)" != "true" ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1

      - name: Audit production dependencies
        run: npm audit --omit=dev
