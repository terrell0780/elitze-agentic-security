name: elitze-agentic-security-enterprise

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      sbom: true
      provenance: mode=max
    image: ${ELITZE_IMAGE:-elitze-agentic-security:enterprise}
    pull_policy: build
    restart: "no"
    command: ["node", "scripts/migrate.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - database_url
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: "1.0"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      sbom: true
      provenance: mode=max
    image: ${ELITZE_IMAGE:-elitze-agentic-security:enterprise}
    pull_policy: build
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL to the customer deployment origin}
      DATABASE_URL_FILE: /run/secrets/database_url
      ELITZE_TRUST_PROXY: ${ELITZE_TRUST_PROXY:-true}
    secrets:
      - database_url
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - edge
      - backend
    ports:
      - "${ELITZE_BIND_ADDRESS:-127.0.0.1}:${ELITZE_HTTP_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g
    cpus: "2.0"
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge

secrets:
  database_url:
    environment: ELITZE_DATABASE_URL
